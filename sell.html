
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sell an Item | Campus Market</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="navbar container">
      <a class="logo" href="index.html">🛍️ Campus Market</a>
      <button class="menu-toggle" aria-label="Toggle navigation">☰</button>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="browse.html">Browse</a>
        <a class="active" href="sell.html">Sell an Item</a>
        <a href="about.html">About</a>
      </div>
      <a class="nav-cta" href="browse.html">Explore items →</a>
    </nav>
  </header>

  <main class="form-page container">
    <div class="form-intro">
      <span class="eyebrow">Give it a new home</span>
      <h1>List an <span>item.</span></h1>
      <p>Share something useful with your campus community.</p>
    </div>

    <form id="sellForm" class="sell-form" novalidate>
      <h2>Item details</h2>
      <p>Fields marked * are required.</p>

      <div class="form-field">
        <label for="productName">Product name *</label>
        <input id="productName" name="productName" type="text"
               placeholder="e.g. Engineering Mathematics book" maxlength="80" required>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="productPrice">Price (₹) *</label>
          <input id="productPrice" name="productPrice" type="number"
                 placeholder="300" min="1" max="1000000" required>
        </div>

        <div class="form-field">
          <label for="productCategory">Category *</label>
          <select id="productCategory" name="productCategory" required>
            <option value="">Choose category</option>
            <option value="books">Books</option>
            <option value="electronics">Electronics</option>
            <option value="bags">Bags</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <div class="form-field">
        <label for="productDescription">Description *</label>
        <textarea id="productDescription" name="productDescription"
                  rows="5" maxlength="600" placeholder="Describe your item..." required></textarea>
        <small id="descriptionCount">0 / 600</small>
      </div>

      <div class="form-field">
        <label for="sellerName">Your name (optional)</label>
        <input id="sellerName" name="sellerName" type="text"
               placeholder="Enter your name">
      </div>

      <p id="formMessage" class="form-message" role="status"></p>
      <button class="button button-primary" type="submit">Post item →</button>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <a class="logo" href="index.html">🛍️ Campus Market</a>
      <p>Made for campus life. Built around reuse.</p>
      <span>© <span data-year></span> Campus Market</span>
    </div>
  </footer>
</body>
</html>
