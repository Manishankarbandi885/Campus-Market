   <main>

    <h1>Sell an Item</h1>

    <p>List your item and sell it to students on your campus.</p>

    <div class="sell-form">

        <label>Product Name</label>
<input type="text" id="productName" placeholder="Enter product name">

<label>Price</label>
<input type="number" id="productPrice" placeholder="Enter price">

<label>Category</label>
<select id="productCategory">
    <option value="">Select category</option>
    <option value="books">Books</option>
    <option value="electronics">Electronics</option>
    <option value="bags">Bags</option>
    <option value="other">Other</option>
</select>

<label>Description</label>
<textarea id="productDescription" placeholder="Describe your item"></textarea>

        <button onclick="postItem()">Post Item</button>

    </div>
